<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <title>Painel de Atendimento</title>
    <style>
        :root { --bg-page: #f5f5f7; --text-main: #1d1d1f; --text-muted: #86868b; --accent: #0071e3; }
        body { background-color: var(--bg-page); color: var(--text-main); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        /* Overlay de Ativação */
        #setup-som {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-page); z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .btn-ativar {
            background: var(--accent); color: white; border: none; padding: 30px 60px;
            font-size: 2rem; font-weight: bold; border-radius: 20px; cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,113,227,0.3); transition: 0.2s;
        }
        .btn-ativar:hover { transform: scale(1.05); background: #007aff; }

        .container { display: grid; grid-template-columns: 1.4fr 0.6fr; width: 98vw; height: 90vh; background: white; border-radius: 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.08); overflow: hidden; }
        .main-display { display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; transition: background-color 0.3s; }
        #senha-atual { font-size: 28rem; font-weight: 800; line-height: 0.8; letter-spacing: -10px; transition: 0.2s; }
        .sidebar { background: #fafafc; border-left: 1px solid #efeff4; padding: 40px; }
        .item { display: flex; justify-content: space-between; padding: 20px 0; border-bottom: 1px solid #f0f0f0; animation: slideIn 0.4s ease-out; }
        .item-num { font-size: 2.5rem; font-weight: 600; color: var(--accent); }
        .flash-active { background-color: #f0f7ff !important; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>
    <div id="setup-som">
        <button class="btn-ativar" onclick="iniciarPainel()">ENTRAR E ATIVAR SOM 🔊</button>
        <p style="margin-top: 20px; color: #888;">Clique no botão para iniciar o sistema com áudio.</p>
    </div>

    <div class="container">
        <main class="main-display" id="display-principal">
            <div style="position: absolute; top: 40px; text-align: center;">
                <div id="data" style="text-transform: capitalize; color: var(--text-muted); margin-bottom: 5px;"></div>
                <div id="hora" style="font-size: 2.5rem; font-weight: 600;">00:00:00</div>
            </div>
            <div style="letter-spacing: 8px; color: var(--text-muted); margin-top: 80px;">SENHA ATUAL</div>
            <div id="senha-atual">00</div>
        </main>
        <aside class="sidebar">
            <h3 style="letter-spacing: 2px; color: var(--text-muted); text-transform: uppercase;">Histórico</h3>
            <div id="historico"></div>
        </aside>
    </div>

    <audio id="som-campainha" src="som.mp3" preload="auto"></audio>

    <script>
        // Liberta o áudio no navegador
        function iniciarPainel() {
            const som = document.getElementById('som-campainha');
            som.play().then(() => {
                som.pause();
                som.currentTime = 0;
                document.getElementById('setup-som').style.display = 'none';
            }).catch(e => alert("Erro ao ativar som. Tente novamente."));
        }

        function atualizarTempo() {
            const agora = new Date();
            document.getElementById('hora').innerText = agora.toLocaleTimeString('pt-BR');
            document.getElementById('data').innerText = agora.toLocaleDateString('pt-BR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }
        setInterval(atualizarTempo, 1000);
        atualizarTempo();

        window.addEventListener('storage', (e) => {
            if (e.key === 'triggerSinal') {
                processarChamada(localStorage.getItem('ultimaSenha'), localStorage.getItem('horaChamada'), localStorage.getItem('tipoOperacao'));
            }
            if (e.key === 'cancelarSinal') {
                const hist = document.getElementById('historico');
                if (hist.firstChild) hist.removeChild(hist.firstChild);
            }
            if (e.key === 'resetarPainel') location.reload();
        });

        function processarChamada(s, h, tipo) {
            const display = document.getElementById('senha-atual');
            const painel = document.getElementById('display-principal');
            const som = document.getElementById('som-campainha');

            display.innerText = s;
            display.style.transform = "scale(1.1)";
            painel.classList.add('flash-active');
            
            // Tocar som
            som.pause();
            som.currentTime = 0;
            som.play().catch(() => {});

            setTimeout(() => { 
                display.style.transform = "scale(1)";
                painel.classList.remove('flash-active');
            }, 300);

            if (tipo === 'chamada') {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<span class="item-num">${s}</span><span style="color: #888; font-size: 1.5rem;">${h}</span>`;
                document.getElementById('historico').prepend(div);
                if (document.getElementById('historico').children.length > 5) document.getElementById('historico').removeChild(document.getElementById('historico').lastChild);
            }
        }
    </script>
</body>
</html>
