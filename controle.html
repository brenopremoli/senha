<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <title>Controle de Atendimento</title>
    <style>
        :root { --bg-page: #f5f5f7; --text-main: #1d1d1f; --accent: #0071e3; }
        body { background: var(--bg-page); font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        #hora-atual { font-size: 1.2rem; color: #888; margin-bottom: 10px; }
        #senha-display { font-size: 6rem; font-weight: bold; color: var(--accent); margin: 10px 0; }
        .btn-chamar { background: var(--text-main); color: white; border: none; padding: 20px; width: 100%; font-size: 1.2rem; font-weight: 600; border-radius: 15px; cursor: pointer; transition: 0.2s; }
        .btn-chamar:hover { background: #000; transform: scale(1.02); }
        
        /* Estilo do Histórico no Controle */
        .hist-title { margin-top: 25px; font-size: 0.8rem; color: #888; letter-spacing: 2px; text-transform: uppercase; }
        .lista-hist { margin-top: 10px; text-align: left; }
        .item-hist { 
            display: flex; justify-content: space-between; padding: 10px; 
            border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.2s;
            border-radius: 8px;
        }
        .item-hist:hover { background: #f0f7ff; color: var(--accent); }
        .btn-reset { background: none; border: 1px solid #ddd; margin-top: 15px; cursor: pointer; color: #999; padding: 5px 10px; border-radius: 5px; font-size: 0.7rem; }
    </style>
</head>
<body>
    <div class="card">
        <div id="hora-atual">00:00:00</div>
        <div style="letter-spacing: 3px; color: #888; font-size: 0.8rem;">SENHA ATUAL</div>
        <div id="senha-display">00</div>
        <button class="btn-chamar" onclick="chamarProxima()">PRÓXIMA (Espaço)</button>
        
        <div class="hist-title">Rechamar (Clique na senha)</div>
        <div id="historico-controle" class="lista-hist"></div>
        
        <button class="btn-reset" onclick="resetar()">Resetar Contador</button>
    </div>

    <script>
        let contador = parseInt(localStorage.getItem('ultimaSenha')) || 0;
        document.getElementById('senha-display').innerText = contador.toString().padStart(2, '0');

        function atualizarRelogio() {
            document.getElementById('hora-atual').innerText = new Date().toLocaleTimeString('pt-BR');
        }
        setInterval(atualizarRelogio, 1000);

        function chamarProxima() {
            contador++;
            const s = contador.toString().padStart(2, '0');
            enviarChamada(s);
            adicionarAoHistoricoControle(s);
        }

        // Função específica para repetir uma senha
        function enviarChamada(s) {
            const h = new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
            localStorage.setItem('ultimaSenha', s);
            localStorage.setItem('horaChamada', h);
            localStorage.setItem('triggerSom', Date.now()); // Dispara o som e flash no painel
            document.getElementById('senha-display').innerText = s;
        }

        function adicionarAoHistoricoControle(s) {
            const container = document.getElementById('historico-controle');
            const div = document.createElement('div');
            div.className = 'item-hist';
            div.innerHTML = `<span>Senha <strong>${s}</strong></span> <small>Rechamar ↻</small>`;
            div.onclick = () => enviarChamada(s); // Ao clicar, chama novamente
            
            container.prepend(div);
            if (container.children.length > 3) container.removeChild(container.lastChild);
        }

        function resetar() {
            if(confirm("Deseja zerar o contador?")) {
                contador = 0;
                localStorage.setItem('ultimaSenha', '00');
                localStorage.setItem('resetarHistorico', Date.now());
                document.getElementById('senha-display').innerText = "00";
                document.getElementById('historico-controle').innerHTML = "";
            }
        }

        document.addEventListener('keydown', (e) => { if (e.code === 'Space' || e.code === 'Enter') chamarProxima(); });
    </script>
</body>
</html>
